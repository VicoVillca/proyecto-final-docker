services:
  database:
    image: mysql:8.0
    container_name: cv-database
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cv_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cv_network

  backend:
    image: sinvidasocial/villca-backend:v.1
    container_name: cv-backend
    ports:
      - "4000:4000"
    environment:
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: cv_db
    depends_on:
      - database
    restart: always
    networks:
      - cv_network

  frontend:
    image: sinvidasocial/villca-frontend:v.1
    container_name: cv-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cv_network

volumes:
  mysql_data:

networks:
  cv_network:
